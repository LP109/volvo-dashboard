<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Home Dashboard - Volvo sign-in</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  code { display: block; padding: 12px; border: 1px solid #8888; border-radius: 8px; word-break: break-all; font-size: 15px; }
  .btn { display: inline-block; margin: 12px 8px 0 0; padding: 10px 18px; border-radius: 8px; border: 1px solid #8888; background: #2a6df4; color: #fff; text-decoration: none; font: inherit; cursor: pointer; }
  .btn.alt { background: transparent; color: inherit; }
  .bad { color: #d33; }
</style>
</head>
<body>
<h1>Volvo sign-in</h1>
<div id="out">Processing...</div>
<script>
  // Shows the OAuth code from Volvo and, when the dashboard sent along its own
  // address (in the OAuth "state"), offers to go back to it. Only addresses on a
  // private home network are accepted, so this page can't be used as an open redirect.
  (function () {
    var q = new URLSearchParams(location.search);
    var out = document.getElementById('out');
    var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
    if (q.get('error')) {
      out.innerHTML = '<p class="bad">Sign-in failed: ' + esc(q.get('error_description') || q.get('error')) + '</p>';
      return;
    }
    var code = q.get('code');
    if (!code) { out.innerHTML = '<p>No sign-in code found. Start the link from the dashboard.</p>'; return; }
    var state = q.get('state') || '';
    var back = null;
    try {
      var s = JSON.parse(atob(state.replace(/-/g, '+').replace(/_/g, '/')));
      var u = new URL(s.r);
      var h = u.hostname;
      var priv = /^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h) || /\.(local|lan|home\.arpa)$/.test(h);
      if ((u.protocol === 'http:' || u.protocol === 'https:') && priv) {
        u.searchParams.set('code', code);
        u.searchParams.set('state', state);
        back = u.toString();
      }
    } catch (e) {}
    history.replaceState(null, '', location.pathname);
    out.innerHTML =
      (back ? '<p>Signed in. Return to your dashboard to finish the link:</p><a class="btn" href="' + esc(back) + '">Back to dashboard</a>' +
              '<p>Not on your home network? Copy the code instead and paste it in the dashboard:</p>'
            : '<p>Signed in. Copy this code and paste it in your dashboard:</p>') +
      '<code id="c">' + esc(code) + '</code><button class="btn alt" id="copy">Copy code</button>';
    document.getElementById('copy').onclick = function () {
      navigator.clipboard.writeText(code).then(function () { document.getElementById('copy').textContent = 'Copied'; });
    };
  })();
</script>
</body>
</html>
